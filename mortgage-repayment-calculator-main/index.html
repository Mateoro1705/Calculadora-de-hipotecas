<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS -->
    <link rel="stylesheet" href="layout/style.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <title>Mortgage repayment calculator</title>
  </head>

  <body>
    <main>
      <section class="mortgageCalculator">
        <form class="calculatorForm">
          <!-- Header -->
          <div class="formHeader">
            <h2 class="formTitle">Mortgage Calculator</h2>
            <button type="reset" class="clearButton">Clear All</button>
          </div>

          <!-- Datos principales -->
          <fieldset class="formSection">
            <div class="inputGroup">
              <label for="amount" class="inputLabel">Mortgage Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                class="textInput"
                required
              />
            </div>

            <!-- Term + Interest -->
            <div class="rateInputs">
              <div class="inputGroup">
                <label for="term" class="inputLabel"> Mortgage Term </label>
                <input
                  type="number"
                  id="term"
                  name="term"
                  class="textInput"
                  required
                />
              </div>

              <div class="inputGroup">
                <label for="rate" class="inputLabel"> Interest Rate </label>
                <input
                  type="number"
                  id="rate"
                  name="rate"
                  class="textInput"
                  step="0.01"
                  required
                />
              </div>
            </div>
          </fieldset>

          <!-- Tipo de hipoteca -->
          <fieldset class="formSection">
            <legend class="sectionTitle">Mortgage Type</legend>

            <div class="radioGroup">
              <label class="radioOption">
                <input
                  type="radio"
                  name="mortgageType"
                  value="repayment"
                  required
                />
                Repayment
              </label>

              <label class="radioOption">
                <input type="radio" name="mortgageType" value="interestOnly" />
                Interest Only
              </label>
            </div>
          </fieldset>

          <!-- Botón -->
          <button type="submit" class="calculateButton">
            📠 Calculate Repayments
          </button>
        </form>

        <!-- Resultados -->
        <aside class="resultsPanel">
          <img
            src="assets/images/illustration-empty.svg"
            alt="Illustration showing no results"
            class="resultsImage"
          />
          <h4 class="resultsTitle">Results shown here</h4>
          <p class="resultsText">
            Complete the form and click “calculate repayments” to see what your
            monthly repayments would be.
          </p>
        </aside>
      </section>
    </main>

    <!-- Footer -->
    <footer class="attributionFooter">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor </a
      >. Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
