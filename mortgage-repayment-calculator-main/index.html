<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="/layout/Style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <!--Fuente de google-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Mortgage repayment calculator</title>
  </head>
  <body>
    <section class="simulador">
      <form action="" class="dataForm">
        <div class="titulos">
          <h2>Mortgage Calculator</h2>
          <h6>Clear All</h6>
        </div>

        <!-- Empty results start -->
        <h4>Mortgage Amount</h4>
        <input type="number" />

        <h4>Mortgage Term</h4>
        <input type="number" />

        <h4>Interest Rate</h4>
        <input type="number" />

        <h4>Mortgage Type</h4>
        <label
          ><input type="checkbox" id="cbox1" value="first_checkbox" />
          Repayment</label
        ><br />

        <label
          ><input type="checkbox" id="cbox1" value="first_checkbox" /> Interest
          Only</label
        ><br />

        <button>Calculate Repayments</button>
      </form>

      <aside class="info_credit">
        <img src="assets/images/illustration-empty.svg" alt="" />
        <h4>Results shown here</h4>
        <p>
          Complete the form and click “calculate repayments” to <br />
          see what your monthly repayments would be.}
        </p>
      </aside>
    </section>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
